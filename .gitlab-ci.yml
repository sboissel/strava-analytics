image: python:3.11

stages:
  - test
  - sync

test:
  stage: test
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    - PYTHONPATH=.:src pytest -q --cov=strava_analytics --cov-report=term-missing

sync:
  stage: sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -r requirements-pipeline.txt
  script:
    - |
      if [ -z "${CI_PUSH_TOKEN}" ]; then
        echo "CI_PUSH_TOKEN is required to commit data/ back to the repository."
        exit 1
      fi
    - PYTHONPATH=src python -m strava_analytics.pipeline
    - |
      if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard -- data/)" ]; then
        echo "No data changes to commit."
        exit 0
      fi
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"
      git config user.name "GitLab CI"
      # Never `git add data` / `git add data/` — if anything ignores the directory,
      # git exits 1 with "paths are ignored: data". Stage only pipeline outputs.
      # Use -f so adds still succeed if a broad data/ ignore is reintroduced.
      if ! git add -f -- \
          data/strava_run_analysis.csv \
          data/strava_run_pace_analysis.csv \
          data/strava_ride_analysis.csv \
          data/strava_swim_analysis.csv \
          data/strava_hike_analysis.csv \
          data/activities_last_week.csv \
          data/highest_activity_id.txt
      then
        echo "ERROR: git add of sync data files failed. Ignore diagnostics:"
        git check-ignore -v \
          data \
          data/ \
          data/strava_run_analysis.csv \
          data/strava_run_pace_analysis.csv \
          data/strava_ride_analysis.csv \
          data/strava_swim_analysis.csv \
          data/strava_hike_analysis.csv \
          data/activities_last_week.csv \
          data/highest_activity_id.txt || true
        git status --short -- data/ || true
        exit 1
      fi
      git commit -m "chore: daily Strava data sync"
      # Schedule may start from an older SHA while main moved (e.g. a merge).
      # Rebase the data commit onto current default branch before pushing.
      REMOTE_URL="https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch "${REMOTE_URL}" "${CI_DEFAULT_BRANCH}"
      if ! git rebase "FETCH_HEAD"; then
        echo "Rebase conflict in data/; preferring sync output."
        git checkout --theirs -- \
          data/strava_run_analysis.csv \
          data/strava_run_pace_analysis.csv \
          data/strava_ride_analysis.csv \
          data/strava_swim_analysis.csv \
          data/strava_hike_analysis.csv \
          data/activities_last_week.csv \
          data/highest_activity_id.txt || true
        if ! git add -f -- \
            data/strava_run_analysis.csv \
            data/strava_run_pace_analysis.csv \
            data/strava_ride_analysis.csv \
            data/strava_swim_analysis.csv \
            data/strava_hike_analysis.csv \
            data/activities_last_week.csv \
            data/highest_activity_id.txt
        then
          echo "ERROR: git add during rebase conflict resolution failed."
          git check-ignore -v data data/ || true
          exit 1
        fi
        GIT_EDITOR=true git rebase --continue
      fi
      git push "${REMOTE_URL}" "HEAD:${CI_DEFAULT_BRANCH}"
