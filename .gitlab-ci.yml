image: python:3.11

stages:
  - test
  - sync

test:
  stage: test
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    - PYTHONPATH=.:src pytest -q --cov=strava_analytics --cov-report=term-missing

sync:
  stage: sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -r requirements-pipeline.txt
  script:
    - |
      if [ -z "${CI_PUSH_TOKEN}" ]; then
        echo "CI_PUSH_TOKEN is required to commit data/ back to the repository."
        exit 1
      fi
    - PYTHONPATH=src python -m strava_analytics.pipeline
    - |
      if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard -- data/)" ]; then
        echo "No data changes to commit."
        exit 0
      fi
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"
      git config user.name "GitLab CI"
      git add data/
      git commit -m "chore: weekly Strava data sync"
      git push "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
